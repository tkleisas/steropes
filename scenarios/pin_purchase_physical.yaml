# The M1 flagship done for real (M3): the compliant finger physically taps
# the rendered keypad. Contact points reported by the physics engine — not
# the commanded coordinates — decide which cells the DUT receives, and the
# peak contact force of every tap is checked against the 6 N budget.
name: pin_purchase_physical
profile: ../profiles/countertop_pos_v1.yaml
seed: 42
steps:
  - action: render
    save: 01_idle.png
  - action: expect_screen_text
    value: READY
  - action: show_screen
    screen: keypad
  - action: render
    save: 02_keypad.png
  - action: decode_keypad
    save: 03_rectified.png
  - action: expect_keypad_matches_ground_truth
  - action: plan_taps              # PIN defaults to the profile's PIN
  - action: expect_tap_count
    value: 4
  - action: enter_pin_physical     # one compliant-finger tap per planned cell
  - action: expect_dut_state
    value: approved
  - action: expect_max_tap_force_below
    n: 6.0
  - action: move_toolhead          # park clear of the screen so the
    x: 60.0                        # overhead camera can read the result
    y: 60.0
  - action: render
    save: 04_result.png
  - action: expect_screen_text
    value: APPROVED
